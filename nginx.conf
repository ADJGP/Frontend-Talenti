# ============================================================================
# nginx — SPA (dist/) + proxy de la API Talenti (FastAPI, BD_Bolsa_Trabajo)
#
# Plantilla para la imagen oficial de nginx: /etc/nginx/templates/*.template
# se procesa con `envsubst` al arrancar. Solo se sustituyen las variables de
# entorno definidas (API_UPSTREAM); las de nginx ($uri, $host…) no se tocan.
#
#   API_UPSTREAM  host:puerto del backend, p. ej. `web:8000` (otro servicio
#                 del mismo compose) o `host.docker.internal:8000` (API en el
#                 host). Por defecto (compose): host.docker.internal:8000.
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------------ #
    # API → backend FastAPI (mismos prefijos que el proxy de vite.config.ts)
    # ------------------------------------------------------------------ #
    location ~ ^(/api/v1|/job-offers|/applications|/categories|/companies|/memberships|/profiles|/skills|/soft-skills|/cvs|/ats|/evaluaciones|/geography|/analytics|/health|/\.well-known) {
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------------ #
    # Assets con hash de versión → cache larga e inmutable
    # ------------------------------------------------------------------ #
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------ #
    # SPA: cualquier otra ruta cae en index.html (client-side routing)
    # ------------------------------------------------------------------ #
    location / {
        try_files $uri $uri/ /index.html;
    }
}
